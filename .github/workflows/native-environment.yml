          "with": {
            "entrypoint": "/usr/local/bin/python3",
            "args": "/github/workspace/environment.py inside-1 left \"a\\\"b\" right"
          }
        },
        {
          "name": "Backslash parity outside quotes n=2",
          "uses": "docker://python:3.12-alpine",
          "continue-on-error": true,
          "with": {
            "entrypoint": "/usr/local/bin/python3",
            "args": "/github/workspace/environment.py outside-2 left a\\\\\"b c\" right"
          }
        },
        {
          "name": "Backslash parity inside quotes n=2",
          "uses": "docker://python:3.12-alpine",
