          "with": {
            "entrypoint": "/usr/local/bin/python3",
            "args": "/github/workspace/environment.py inside-2 left \"a\\\\\"b\" right"
          }
        },
        {
          "name": "Backslash parity outside quotes n=3",
          "uses": "docker://python:3.12-alpine",
          "continue-on-error": true,
          "with": {
            "entrypoint": "/usr/local/bin/python3",
            "args": "/github/workspace/environment.py outside-3 left a\\\\\\\"b c\" right"
          }
        },
        {
          "name": "Backslash parity inside quotes n=3",
          "uses": "docker://python:3.12-alpine",
          "continue-on-error": true,
          "with": {
            "entrypoint": "/usr/local/bin/python3",
            "args": "/github/workspace/environment.py inside-3 left \"a\\\\\\\"b\" right"
          }
        },
        {
          "name": "Backslash parity outside quotes n=4",
          "uses": "docker://python:3.12-alpine",
          "continue-on-error": true,
          "with": {
            "entrypoint": "/usr/local/bin/python3",
            "args": "/github/workspace/environment.py outside-4 left a\\\\\\\\\"b c\" right"
          }
        },
        {
          "name": "Backslash parity inside quotes n=4",
          "uses": "docker://python:3.12-alpine",
          "continue-on-error": true,
          "with": {
            "entrypoint": "/usr/local/bin/python3",
            "args": "/github/workspace/environment.py inside-4 left \"a\\\\\\\\\"b\" right"
          }
        },
        {
          "name": "Consecutive quote case 1",
          "uses": "docker://python:3.12-alpine",
          "continue-on-error": true,
          "with": {
            "entrypoint": "/usr/local/bin/python3",
            "args": "/github/workspace/environment.py consecutive-1 left \"\"\"\" right"
          }
        },
        {
          "name": "Consecutive quote case 2",
          "uses": "docker://python:3.12-alpine",
          "continue-on-error": true,
          "with": {
            "entrypoint": "/usr/local/bin/python3",
            "args": "/github/workspace/environment.py consecutive-2 left a\"\"b right"
          }
        },
        {
          "name": "Consecutive quote case 3",
          "uses": "docker://python:3.12-alpine",
          "continue-on-error": true,
          "with": {
            "entrypoint": "/usr/local/bin/python3",
            "args": "/github/workspace/environment.py consecutive-3 left \"a\"\"b\" right"
          }
        },
        {
          "name": "Consecutive quote case 4",
          "uses": "docker://python:3.12-alpine",
          "continue-on-error": true,
          "with": {
            "entrypoint": "/usr/local/bin/python3",
            "args": "/github/workspace/environment.py consecutive-4 left \"a\"\"\"b\" right"
          }
        },
        {
          "name": "Consecutive quote case 5",
          "uses": "docker://python:3.12-alpine",
          "continue-on-error": true,
          "with": {
            "entrypoint": "/usr/local/bin/python3",
            "args": "/github/workspace/environment.py consecutive-5 left \"\" \"\" right"
          }
        },
        {
          "name": "Consecutive quote case 6",
          "uses": "docker://python:3.12-alpine",
          "continue-on-error": true,
          "with": {
            "entrypoint": "/usr/local/bin/python3",
            "args": "/github/workspace/environment.py consecutive-6 left pre\"\"\"\"post right"
          }
        }
      ]
    }
  }
}
